name: Deploy preview to GitHub Pages

# This repository PRODUCES the Markdown in output/ (the deliverable that is
# copied manually into the production ISO-TC204 site repository).
#
# As a convenience, it also builds a local mkdocs preview and deploys it to this
# repo's GitHub Pages (gh-pages branch) so the conversion result can be reviewed
# online. This is a PREVIEW only; production is built/deployed elsewhere.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Test, Build & Deploy preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Run preflight checks
        run: mise run preflight

      - name: Run test suite
        run: mise run test

      - name: Check documents for unconvertible content
        run: mise run check

      - name: Convert documents
        run: mise run convert

      - name: Generate navigation
        run: mise run gen

      - name: Build mkdocs site (strict)
        run: uv run mkdocs build --strict

      - name: Deploy preview to gh-pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
