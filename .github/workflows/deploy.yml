name: CI

# This repository only PRODUCES the Markdown in output/. The production
# ISO-TC204 site is built and deployed from a separate repository; the
# output/extracts/<doc>/ folders are copied there manually.
#
# This workflow therefore validates the pipeline (tests + convert + a strict
# mkdocs build) but does NOT deploy anywhere.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Run preflight checks
        run: mise run preflight

      - name: Run test suite
        run: mise run test

      - name: Check documents for unconvertible content
        run: mise run check

      - name: Convert documents
        run: mise run convert

      - name: Generate navigation
        run: mise run gen

      - name: Build mkdocs site (strict)
        run: uv run mkdocs build --strict

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
