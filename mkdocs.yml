site_name: ITS Standard Extracts
site_description: Informative extracts of selected ISO / CEN / EN technical standards prepared for ISO/TC 204.

# The converted Markdown in output/ is the mkdocs source tree.
docs_dir: output
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo

plugins:
  - search
  - macros:
      module_name: macros

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

# NAV is regenerated by gen_nav.py between the markers below.
# Do not edit by hand.
# >>> GENERATED NAV START
nav:
  - Overview: index.md
  - Extracts:
      - CEN/TS 16157-13: extracts/CEN_TS_16157-13/index.md
      - EN 18052: extracts/EN_18052/index.md
      - EN ISO 12855: extracts/EN_ISO_12855/index.md
      - EN ISO 14906: extracts/EN_ISO_14906/index.md
      - EN ISO 17573-1: extracts/EN_ISO_17573-1/index.md
      - ISO/TR 4448-1: extracts/ISO_4448-1/index.md
      - ISO 14823-1: extracts/ISO_14823-1/index.md
      - ISO 15622: extracts/ISO_15622/index.md
      - ISO 17748-3: extracts/ISO_17748-3/index.md
      - ISO 21214: extracts/ISO_21214/index.md
      - ISO 23792-1: extracts/ISO_23792-1/index.md
      - ISO 26683-2: extracts/ISO_26683-2/index.md
      - ISO/TS 14812: extracts/ISO_TS_14812/index.md
      - ISO/TS 19091: extracts/ISO_TS_19091/index.md
      - ISO/TS 22726-1: extracts/ISO_TS_22726-1/index.md
      - ISO/TS 22741-10: extracts/ISO_TS_22741-10/index.md
# <<< GENERATED NAV END
