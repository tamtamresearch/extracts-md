# mise configuration for the ITS Standard Extracts mkdocs site.
#
# First-time setup:
#   mise install          # install pinned tools (uv, watchexec)
#   mise run setup        # uv installs Python (.python-version) + deps (pyproject)
#
# Day to day:
#   mise run convert      # docx -> output/extracts/<doc>/index.md  (+ figures)
#   mise run gen          # regenerate nav + landing page from front-matter
#   mise run build        # build the static mkdocs site into site/
#   mise run serve        # local preview with live reload (mkdocs)
#   mise run all          # convert + gen + build
#   mise run dev          # watch docx -> convert/gen + serve with browser reload
#   mise run check        # scan docx for content that breaks conversion (e.g. vector figures)

[tools]
uv = "latest"
"aqua:watchexec/watchexec" = "latest"

[settings]
# Let mise pick up the uv-managed Python toolchain.
python.uv_venv_auto = true

[tasks.setup]
description = "Install Python (via uv) and project dependencies"
run = "uv sync"

[tasks.convert]
description = "Convert input/*.docx to output/extracts/<doc>/index.md with figures + HTML tables"
run = "uv run python convert_docx.py input output"

[tasks.gen]
description = "Regenerate the mkdocs nav include and landing page from front-matter"
run = "uv run python gen_nav.py output"

[tasks.build]
description = "Build the static mkdocs site into site/"
depends = ["gen"]
run = "uv run mkdocs build"

[tasks.serve]
description = "Serve the site locally with live reload (mkdocs)"
depends = ["gen"]
run = "uv run mkdocs serve --open"

[tasks.all]
description = "Full pipeline: convert -> gen -> build"
depends = ["convert", "gen"]
run = "uv run mkdocs build"

[tasks.rebuild]
description = "Reconvert docx and regenerate nav (output/ refresh for live reload)"
depends = ["convert", "gen"]

[tasks.watch]
description = "Watch input/*.docx and reconvert + regenerate nav on change"
run = "watchexec --exts docx --watch input --restart -- mise run rebuild"

[tasks.dev]
description = "Live dev: watch docx -> convert/gen, and serve with browser reload"
depends = ["gen"]
run = [
  "mise run watch &",
  "uv run mkdocs serve --open",
]

[tasks.check]
description = "Scan input/*.docx for content that breaks conversion (e.g. vector figures)"
run = "uv run python convert_docx.py --check input"

[tasks.preflight]
description = "Validate environment (dependencies)"
run = "uv run pytest tests/test_preflight.py -v"

[tasks.test]
description = "Run pytest test suite (integration + unit)"
depends = ["preflight"]
run = "uv run pytest tests/ -v"

[tasks.test-integration]
description = "Run only integration tests (implementation-agnostic)"
run = "uv run pytest tests/test_integration.py -v"

[tasks.test-unit]
description = "Run only unit tests (implementation-specific)"
run = "uv run pytest tests/unit/ -v"
